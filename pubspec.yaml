# Nome do aplicativo (deve seguir snake_case)
name: meu_app_financas

# Descrição do projeto
description: "Aplicativo de gerenciamento financeiro pessoal desenvolvido em Flutter com recursos completos de anotações, projetos e controle financeiro."

publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  flutter_slidable: ^3.0.0
  pull_to_refresh: ^2.0.0
  syncfusion_flutter_datepicker: ^30.2.4
  flutter_launcher_icons: ^0.13.1

  # HTTP / rede
  http: ^1.4.0
  connectivity_plus: ^6.1.4

  # Dados locais
  shared_preferences: ^2.2.2
  intl: ^0.20.2

  # Notificações
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  permission_handler: ^11.3.1

  # Autenticação biométrica  ← ADICIONADO
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  mockito: ^5.4.2

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"